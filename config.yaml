# 代理策略组
proxy-groups:
  # 默认代理
  - { name: 默认代理, type: select, proxies:  [自动选择, 手动选择, 故障转移, 负载均衡散列, 负载均衡轮询, DIRECT, REJECT-DROP, REJECT], icon: "https://raw.githubusercontent.com/s0lnce/mofish-icon/refs/heads/main/mihomo/pure/corner/select.png"}

  # 自动选择
  - { name: 自动选择,  type: url-test, url: "https://cp.cloudflare.com/generate_204", interval: 188, tolerance: 38, empty-fallback: REJECT, include-all: true, lazy: true , icon: https://github.com/Koolson/Qure/raw/master/IconSet/Color/Auto.png }
 
  # 手动选择
  - { name: 手动选择, type: select, include-all: true, icon: https://github.com/Koolson/Qure/raw/master/IconSet/Color/Clubhouse.png }
  
  # 故障转移
  - { name: 故障转移,  type: fallback, url: "https://cp.cloudflare.com/generate_204", interval: 188, empty-fallback: REJECT, include-all: true, lazy: true , icon: https://github.com/Koolson/Qure/raw/master/IconSet/Color/ULB.png }

