  #   password: password

# 基础设置
mode: rule
mixed-port: 7890
redir-port: 7892
tproxy-port: 7893
authentication: [""]
skip-auth-prefixes:
  - 127.0.0.0/8
  - 192.168.0.0/16
  - ::1/128
allow-lan: true
bind-address: "*"
ipv6: true
unified-delay: true
tcp-concurrent: true
log-level: warning
keep-alive-idle: 600
keep-alive-interval: 15
disable-keep-alive: false  # 禁用 TCP Keep Alive，false 即启用 Keep-Alive，连接保持开启，允许多个请求复用同一个 TCP 连接 #目前在android端强制为true
#experimental: {quic-go-disable-gso: true} #默认false 只有 QUIC 节点异常时才设 true
find-process-mode: 'strict' #strict
profile:
  store-selected: true
  store-fake-ip: true
  
# geox-url:
  # geoip: "https://fastly.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geoip.dat"
  # geosite: "https://fastly.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geosite.dat"
  # mmdb: "https://fastly.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geoip.metadb"
# geo-auto-update: false # 是否自动更新 geodata
# geo-update-interval: 24 # 更新间隔，单位：小时

# 控制面板
external-controller: :9999
secret:
external-ui: ui
external-ui-name: meta_xd
external-ui-url: "https://cdn.jsdelivr.net/gh/juewuy/ShellCrash@update/bin/dashboard/meta_xd.tar.gz"

#routing-mark: 7894 # 配置 fwmark 仅用于 Linux 和route-exclude-address-set冲突

#Hosts
hosts:
  'time.android.com': 203.107.6.88
  'time.facebook.com': 203.107.6.88
  'services.googleapis.cn': services.googleapis.com
  'localhost': 127.0.0.1
use-system-hosts: true
 
# NTP 
ntp:
  enable: true
  write-to-system: true
  
# TUN模式
tun:
  enable: true
  stack: mips   ##如果内核版本大于v1.19.31，此处可以改为自研协议栈 mips ，理论上性能更好。
  dns-hijack: ["any:53", "tcp://any:53"]
  auto-route: true
  auto-redirect: true  #仅支持 Linux，自动配置 iptables/nftables 重定向 TCP，需 auto-route 已启用
  auto-detect-interface: true
  strict-route: true
  route-exclude-address-set: #将规则集 IP 加入防火墙使其绕过路由，仅支持 Linux，且需要 nftables 以及 auto-route 和 auto-redirect 已启用
    - cn_ip
    
# 流量嗅探
sniffer:
  enable: true
  override-destination: false
  force-dns-mapping: false
  parse-pure-ip: true
  sniff:
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]
  skip-domain:
    - "Mijia Cloud"
    - "+.push.apple.com"
  force-domain:               # 强制进行嗅探的域名
    - "+.v2ex.com"

# DNS设置
dns:
  enable: true
  cache-algorithm: arc
  listen: 0.0.0.0:1053 # 开启 DNS 服务器监听
#  prefer-h3: false # 是否开启 DoH 支持 HTTP/3，将并发尝试
  ipv6: true
#  ipv6-timeout: 300 # 单位：ms，内部双栈并发时，向上游查询 AAAA 时，等待 AAAA 的时间，默认 100ms
  enhanced-mode: fake-ip
  fake-ip-ttl: 1
  fake-ip-range: 198.18.0.0/15
  fake-ip-range6: 2001:2::/64
  fake-ip-filter-mode: blacklist
#  respect-rules: true  #下面#默认代理 可以替代掉
  use-hosts: true # 查询 hosts
  default-nameserver:
    - https://223.5.5.5/dns-query
    - https://119.29.29.29/dns-query
#    - 2400:3200::1
#    - system
  nameserver:
    - https://1.1.1.1/dns-query#默认代理&disable-qtype-65=true
    - https://8.8.8.8/dns-query#默认代理&disable-qtype-65=true
  proxy-server-nameserver:
    - https://223.5.5.5/dns-query
    - https://119.29.29.29/dns-query
  direct-nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  nameserver-policy:
    "rule-set:cn_domain,private_domain,fakeipfilter_cn,steamcn_domain,microsoftcn_domain,applecn_domain,gamescn_domain,applications_text,trackerslist_domain":
    - https://dns.alidns.com/dns-query#disable-qtype-65=true
    - https://doh.pub/dns-query#disable-qtype-65=true
    "rule-set:fakeipfilter_!cn":
    - https://1.1.1.1/dns-query#默认代理&disable-qtype-65=true
    - https://8.8.8.8/dns-query#默认代理&disable-qtype-65=true
  # fallback:
    # - https://8.8.8.8/dns-query#默认代理
  # fallback-filter:
    # geoip: true
    # geoip-code: CN
  fake-ip-filter:
# qichiyu    
    - rule-set:fakeipfilter_cn
    - rule-set:fakeipfilter_!cn
    - rule-set:private_domain
    - rule-set:cn_domain
    - rule-set:microsoftcn_domain
    - rule-set:applecn_domain
    - rule-set:steamcn_domain
    - rule-set:gamescn_domain
    - rule-set:applications_text
    - rule-set:trackerslist_domain
    
# 代理策略组
