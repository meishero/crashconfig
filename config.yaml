# 锚点配置
rule-anchor:
  # 节点
  x-url-test:     &url-test     { type: url-test, url: "https://cp.cloudflare.com/generate_204", interval: 188, tolerance: 38, empty-fallback: REJECT, include-all: true, lazy: true }
  x-load-balance: &load-balance { type: load-balance, url: "https://cp.cloudflare.com/generate_204", interval: 188, empty-fallback: REJECT, include-all: true, lazy: true }
  x-fallback:     &fallback     { type: fallback, url: "https://cp.cloudflare.com/generate_204", interval: 188, empty-fallback: REJECT, include-all: true, lazy: true }
  
  # 策略组
  x-oversea:      &oversea      {type: select, proxies:  [自动选择, 手动选择, 故障转移, 负载均衡散列, 负载均衡轮询, DIRECT, REJECT-DROP, REJECT]}
  
  # 规则集
  x-rule-set-domain: &rule-set-domain { type: http, behavior: domain, format: mrs, interval: 86400, proxy: DIRECT }
  x-rule-set-domain-text: &rule-set-domain-text { type: http, behavior: domain, format: text, interval: 86400, proxy: DIRECT }
  x-rule-set-domain-classical: &rule-set-domain-classical { type: http, behavior: classical, format: text, interval: 86400, proxy: DIRECT }
  x-rule-set-ipcidr: &rule-set-ipcidr { type: http, behavior: ipcidr, format: mrs, interval: 86400, proxy: DIRECT }

# 代理提供者
proxy-providers:
  edgetunnel:
    type: http
    url: "https://www0802.meishero3.dpdns.org/sub?token=100e27bda76c66ae91f9e09c3f78acda"
    path: "./providers/edgetunnel.yaml"
    interval: 1500
    proxy: DIRECT
    empty-fallback: REJECT
    health-check:
      enable: true
      lazy: true
      url: "https://cp.cloudflare.com/generate_204"
      interval: 188
# #并发测速为16
      # concurrency: 16
# #超时时间为1.5s   如果存在丢包重传 时间肯定比较大 扔掉那些丢包严重的
      # timeout: 1500
    override:
      udp: true
      skip-cert-verify: true
    filter: '(?i)^(?!.*(官方|剩余|重置|到期|防失联|官网|导航|客服|群|t.me|邀请|返利|循环|网站|网址|获取|订阅|流量|机场|软件|装新|下次|版本|官址|备用|过期|已用|联系|邮箱|工单|贩卖|通知|倒卖|防止|国内|地址|频道|无法|说明|使用|提示|特别|访问|支持|教程|关注|作者|加入|USE|USED|TOTAL|EXPIRE|EMAIL|Panel|Author|分享|bestcf.pages.dev)).*$'
    
